name: faida_pos
description: "POS app for small vendors and shops"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  window_size: ^0.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  path: ^1.8.3
  image_picker: ^1.0.4
  intl: ^0.20.2
  sqflite_common_ffi: ^2.4.0+2
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/splash_logo.png

localization:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations

flutter_native_splash:
  color: "#05421d"
  image: assets/images/splash_logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#05421d"
    image: assets/images/splash_logo.png
